      if (localHosts.indexOf(host) === -1 && host !== canonicalHost) {
        location.replace('https://' + canonicalHost + '/admin.html' + location.search + location.hash);
      }
    })();

  <style>
    :root{--bg:#f4f8fd;--card:#ffffff;--card2:#eef5fc;--line:#d8e3ef;--text:#0f172a;--muted:#64748b;--cyan:#22d3ee;--cyan2:#0ea5e9}

    @media(max-width:750px){.top-actions{width:100%;justify-content:center}.guide-header-btn,.back,.top-actions .admin-btn{width:100%;justify-content:center;text-align:center}.guide-grid{grid-template-columns:1fr}.guide-config{padding:12px}.guide-config-title{font-size:16px}}

    /* v63: mobile admin không cắt nội dung iframe và có nút lên đầu trang */
    .admin-scroll-top{position:fixed;right:18px;bottom:18px;z-index:99990;display:none;align-items:center;justify-content:center;gap:7px;border:1px solid #bae6fd;background:#22d3ee;color:#00111f;border-radius:999px;padding:11px 14px;min-width:46px;min-height:46px;box-shadow:0 12px 30px rgba(15,23,42,.18);font-size:14px;font-weight:500;cursor:pointer}

  </style>

  <script>
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (_) {}
    var DEFAULT_ADMIN_SECRET = 'ThanhCong2027###';
    var ADMIN_LOGIN_EMAIL = 'vantheweb@gmail.com';
    var ADMIN_LOGIN_PASSWORD = 'ThanhCong2027###';
    var ADMIN_REMEMBER_KEY = 'TUBEKEY_ADMIN_REMEMBER_LOGIN';
    var ADMIN_SAVED_EMAIL_KEY = 'TUBEKEY_ADMIN_SAVED_EMAIL';
    var ADMIN_SAVED_PASS_KEY = 'TUBEKEY_ADMIN_SAVED_PASSWORD';
    var ADMIN_GUIDE_VIDEO_URL = '';
    var ADMIN_KEY_GUIDE_VIDEO_URL = '';
    function setGuideMsg(text, ok){
      var el = document.getElementById('guideVideoMsg');
      if (!el) return;
      el.textContent = text || '';
      el.className = 'guide-msg ' + (text ? (ok ? 'ok' : 'err') : '');
    }
    function extractGuideYoutubeId(input){
      var text = String(input || '').trim();
      if (!text) return '';
      text = text.split('&t=')[0].split('?t=')[0];
      var patterns = [
        /(?:v=|v\/|embed\/|shorts\/|live\/|youtu\.be\/|\/v\/|watch\?v%3D|watch\?feature=player_embedded&v=|watch\?v=)([^"&?\/\s]{11})/i,
        /^[a-zA-Z0-9_-]{11}$/
      ];
      for (var i=0;i<patterns.length;i++){
        var match = text.match(patterns[i]);
        if (match && match[1]) return match[1];
        if (match && patterns[i].source.indexOf('(') === -1) return match[0];
      }
      var coarse = text.match(/[a-zA-Z0-9_-]{11}/);
      return coarse ? coarse[0] : '';
    }
    function openGuideVideo(url){
      var link = String(url || ADMIN_GUIDE_VIDEO_URL || '').trim();
      if (!link) {
        setGuideMsg('Chưa có link video hướng dẫn. Hãy dán link rồi bấm Lưu link.', false);
        alert('Chưa có link video hướng dẫn.');
        return;
      }
      var id = extractGuideYoutubeId(link);
      if (!id) {
        setGuideMsg('Link video hướng dẫn phải là link YouTube hợp lệ.', false);
        alert('Link video hướng dẫn phải là link YouTube hợp lệ.');
        return;
      }
      var modal = document.getElementById('guideVideoModal');
      var frame = document.getElementById('guideVideoFrame');
      if (frame) frame.src = 'https://www.youtube.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0';
      if (modal) { modal.classList.add('active'); modal.setAttribute('aria-hidden','false'); }
    }
    function closeGuideVideo(){
      var modal = document.getElementById('guideVideoModal');
      var frame = document.getElementById('guideVideoFrame');
      if (frame) frame.src = '';
      if (modal) { modal.classList.remove('active'); modal.setAttribute('aria-hidden','true'); }
    }
    async function loadGuideSettings(){
      try {
        var res = await fetch('/api/admin-settings?action=get', { cache:'no-store', headers:{ 'x-admin-password': getSharedSecret() } });
        var data = await res.json().catch(function(){ return {}; });
        if (!res.ok || data.success === false) throw new Error(data.error || 'Không tải được cấu hình video hướng dẫn.');
        var guide = (data.settings && data.settings.guide) || {};
        var url = String(guide.videoUrl || '').trim();
        var keyGuideUrl = String(guide.keyGuideVideoUrl || '').trim();
        ADMIN_GUIDE_VIDEO_URL = url;
        ADMIN_KEY_GUIDE_VIDEO_URL = keyGuideUrl;
        var input = document.getElementById('adminGuideVideoUrl');
        var keyInput = document.getElementById('adminKeyGuideVideoUrl');
        if (input) input.value = url;
        if (keyInput) keyInput.value = keyGuideUrl;
      } catch (e) {
        setGuideMsg(e && e.message ? e.message : 'Không tải được cấu hình video hướng dẫn.', false);
      }
    }
    async function saveGuideSettings(){
      var input = document.getElementById('adminGuideVideoUrl');
      var keyInput = document.getElementById('adminKeyGuideVideoUrl');
      var url = String((input && input.value) || '').trim();
      var keyGuideUrl = String((keyInput && keyInput.value) || '').trim();
      if (url && !extractGuideYoutubeId(url)) {
        setGuideMsg('Link video hướng dẫn chính phải là link YouTube hợp lệ.', false);
        return;
      }
      if (keyGuideUrl && !extractGuideYoutubeId(keyGuideUrl)) {
        setGuideMsg('Link nút Hướng dẫn lấy Key phải là link YouTube hợp lệ.', false);
        return;
      }
      try {
        setGuideMsg('Đang lưu link video hướng dẫn...', true);
        var res = await fetch('/api/admin-settings?action=save-guide', {
          method:'POST',
          headers:{ 'Content-Type':'application/json', 'x-admin-password': getSharedSecret() },
          body: JSON.stringify({ guide:{ videoUrl:url, keyGuideVideoUrl:keyGuideUrl } })
        });
        var data = await res.json().catch(function(){ return {}; });
        if (!res.ok || data.success === false) throw new Error(data.error || 'Không lưu được link video hướng dẫn.');
        var savedGuide = (data.settings && data.settings.guide) || {};
        ADMIN_GUIDE_VIDEO_URL = String(savedGuide.videoUrl || url).trim();
        ADMIN_KEY_GUIDE_VIDEO_URL = String(savedGuide.keyGuideVideoUrl || keyGuideUrl).trim();
        if (input) input.value = ADMIN_GUIDE_VIDEO_URL;
        if (keyInput) keyInput.value = ADMIN_KEY_GUIDE_VIDEO_URL;
        setGuideMsg('Đã lưu link video hướng dẫn và link nút Hướng dẫn lấy Key.', true);
      } catch (e) {
        setGuideMsg(e && e.message ? e.message : 'Không lưu được link video hướng dẫn.', false);
      }
    }
    function clearAdminStoredCredentials(){
      var localKeys = [
        ADMIN_REMEMBER_KEY, ADMIN_SAVED_EMAIL_KEY, ADMIN_SAVED_PASS_KEY,
        'TUBEKEY_ADMIN_EMAIL', 'ADMIN_SHARED_SECRET', 'ADMIN_SECRET_RESEARCH',
        'ADMIN_SECRET', 'admin_settings_password', 'admin_settings_login_at'
      ];
      localKeys.forEach(function(k){ try { localStorage.removeItem(k); } catch (_) {} });
    }
    function clearAdminSession(){
      try {
        sessionStorage.removeItem('TUBEKEY_ADMIN_AUTH_OK');
        sessionStorage.removeItem('TUBEKEY_ADMIN_SESSION_EMAIL');
        sessionStorage.removeItem('TUBEKEY_ADMIN_SESSION_SECRET');
      } catch (_) {}
      ADMIN_RUNTIME_SECRET = '';
    }
    function saveAdminSession(){
      try {
        sessionStorage.setItem('TUBEKEY_ADMIN_AUTH_OK', '1');
        sessionStorage.setItem('TUBEKEY_ADMIN_SESSION_EMAIL', ADMIN_LOGIN_EMAIL);
        sessionStorage.setItem('TUBEKEY_ADMIN_SESSION_SECRET', ADMIN_LOGIN_PASSWORD);
      } catch (_) {}
      ADMIN_RUNTIME_SECRET = ADMIN_LOGIN_PASSWORD;
    }
    function restoreAdminSession(){
      try {
        var ok = sessionStorage.getItem('TUBEKEY_ADMIN_AUTH_OK') === '1';
        var email = String(sessionStorage.getItem('TUBEKEY_ADMIN_SESSION_EMAIL') || '').trim().toLowerCase();
        var secret = String(sessionStorage.getItem('TUBEKEY_ADMIN_SESSION_SECRET') || '');
        if (ok && email === ADMIN_LOGIN_EMAIL && secret === ADMIN_LOGIN_PASSWORD) {
          ADMIN_RUNTIME_SECRET = secret;
          return true;
        }
      } catch (_) {}
      clearAdminSession();
      return false;
    }
    function shouldRememberAdmin(){ return false; }
    function loadRememberedAdmin(){
      clearAdminStoredCredentials();
      var e = document.getElementById('adminLoginEmail');
      var p = document.getElementById('adminLoginPassword');
      if (e) { e.value = ''; e.setAttribute('autocomplete','off'); }
      if (p) { p.value = ''; p.setAttribute('autocomplete','new-password'); }
      setTimeout(function(){
        try { if (e) e.value = ''; if (p) p.value = ''; } catch (_) {}
      }, 150);
    }
    function saveRememberedAdmin(){ clearAdminStoredCredentials(); }
    function getSharedSecret(){
      return String(ADMIN_RUNTIME_SECRET || DEFAULT_ADMIN_SECRET).trim();
    }
    function saveSharedSecret(value){
      var input = document.getElementById('sharedAdminSecret');
      var v = String(value || (input && input.value) || DEFAULT_ADMIN_SECRET).trim() || DEFAULT_ADMIN_SECRET;
      ADMIN_RUNTIME_SECRET = v;
      if (input) input.value = v;
      var note = document.getElementById('sharedSecretNote');
      if (note) note.textContent = '';
      syncSharedSecretToFrames();
    }
    function syncSharedSecretToFrame(frame){
      try {
        var win = frame.contentWindow;
        if (!win) return;
        var value = getSharedSecret();
        if (typeof win.syncSharedAdminSecret === 'function') win.syncSharedAdminSecret(value);
        else win.postMessage({ type: 'ADMIN_SHARED_SECRET', value: value }, location.origin);
      } catch (_) {}
    }
    function syncSharedSecretToFrames(){
      syncSharedSecretToFrame(document.getElementById('accountsFrame'));
      syncSharedSecretToFrame(document.getElementById('intakeFrame'));
      syncSharedSecretToFrame(document.getElementById('settingsFrame'));
      syncSharedSecretToFrame(document.getElementById('emailFrame'));
      syncSharedSecretToFrame(document.getElementById('keepaliveFrame'));
    }
    function refreshActivePanel(){
      saveSharedSecret();
      var isSettings = !document.getElementById('settingsCard').classList.contains('hidden');
      var isEmail = !document.getElementById('emailCard').classList.contains('hidden');
      var isKeepalive = !document.getElementById('keepaliveCard').classList.contains('hidden');
      var isIntake = !document.getElementById('intakeCard').classList.contains('hidden');
      var frame = isKeepalive ? document.getElementById('keepaliveFrame') : (isEmail ? document.getElementById('emailFrame') : (isSettings ? document.getElementById('settingsFrame') : (isIntake ? document.getElementById('intakeFrame') : document.getElementById('accountsFrame'))));
      try {
        var win = frame.contentWindow;
        if (isKeepalive && typeof win.loadStatus === 'function') win.loadStatus(true);
        else if (isEmail && typeof win.load === 'function') win.load();
        else if (isSettings && typeof win.loadConfig === 'function') win.loadConfig();
        else if (isIntake && typeof win.loadCampaigns === 'function') win.loadCampaigns(true);
        else if (!isSettings && !isEmail && !isKeepalive && !isIntake && typeof win.loadUsers === 'function') win.loadUsers(win.currentUsersPage || 1, true);
      } catch (_) {}
      setTimeout(function(){ resizeFrame(frame); }, 600);
    }
    function getFrameContentHeight(frame){
      try {
        if (!frame || !frame.contentWindow) return 0;
        if (frame.closest && frame.closest('.hidden')) return 0;
        var doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc) return 0;
        var main = doc.querySelector('.wrap') || doc.querySelector('.page') || doc.body;
        if (!main) return 0;
        try {
          frame.setAttribute('scrolling', 'no');
          frame.style.overflow = 'visible';
          doc.documentElement.style.minHeight = '0';
          doc.body.style.minHeight = '0';
          doc.documentElement.style.overflowX = 'hidden';
          doc.body.style.overflowX = 'hidden';
          doc.documentElement.style.overflowY = 'visible';
          doc.body.style.overflowY = 'visible';
        } catch (_) {}
        var rect = main.getBoundingClientRect ? main.getBoundingClientRect() : null;
        // v81: chỉ đo chiều cao nội dung thật của .wrap/.page.
        // Không dùng body/documentElement.scrollHeight vì chiều cao đó bị ảnh hưởng
        // bởi chính iframe, gây vòng lặp tự kéo dài trang xuống khoảng trắng.
        var h = Math.max(
          main.offsetHeight || 0,
          main.scrollHeight || 0,
          rect ? Math.ceil(rect.height) : 0
        );
        var children = main.children || [];
        var bottom = 0;
        for (var i = 0; i < children.length; i++) {
          var el = children[i];
          if (!el || el.offsetParent === null) continue;
          var r = el.getBoundingClientRect ? el.getBoundingClientRect() : null;
          if (r && rect) bottom = Math.max(bottom, Math.ceil(r.bottom - rect.top));
        }
        var mobileExtra = (window.innerWidth || document.documentElement.clientWidth || 0) <= 760 ? 120 : 60;
        h = Math.max(h, bottom, 360) + mobileExtra;
        return Math.min(Math.ceil(h), 50000);
      } catch (_) { return 0; }
    }
    function resizeFrame(frame){
      try {
        if (!frame || !frame.contentWindow) return;
        if (frame.closest && frame.closest('.hidden')) return;
        var h = getFrameContentHeight(frame);
        if (!h) return;
        frame.style.height = h + 'px';
      } catch (_) {}
    }
    function attachFrameResizeWatcher(frame){
      try {
        if (!frame || frame.__resizeWatcherAttached) return;
        var doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc) return;
        frame.__resizeWatcherAttached = true;
        var timer = null;
        function schedule(){
          clearTimeout(timer);
          timer = setTimeout(function(){ resizeFrame(frame); }, 80);
        }
        var target = doc.querySelector('.wrap') || doc.querySelector('.page') || doc.body;
        if (window.ResizeObserver && target) {
          var ro = new ResizeObserver(schedule);
          ro.observe(target);
          frame.__resizeObserver = ro;
        }
        if (window.MutationObserver && target) {
          var mo = new MutationObserver(schedule);
          mo.observe(target, { childList:true, subtree:true, attributes:true, characterData:true });
          frame.__mutationObserver = mo;
        }
      } catch (_) {}
    }
    function handleFrameLoad(frame, name){
      saveSharedSecret();
      syncSharedSecretToFrame(frame);
      setTimeout(function(){ resizeFrame(frame); attachFrameResizeWatcher(frame); }, name === 'settings' ? 500 : 300);
    }
    window.handleFrameLoad = handleFrameLoad;
    try {
      (window.__pendingAdminFrameLoads || []).splice(0).forEach(function(item){
        if (item && item[0]) handleFrameLoad(item[0], item[1]);
      });
    } catch (_) {}
    window.addEventListener('message', function(ev){
      try {
        if (ev.origin !== location.origin) return;
        var data = ev.data || {};
        if (data.type !== 'ADMIN_PANEL_HEIGHT') return;
        var frames = [document.getElementById('accountsFrame'), document.getElementById('intakeFrame'), document.getElementById('settingsFrame'), document.getElementById('emailFrame'), document.getElementById('keepaliveFrame')];
        for (var i = 0; i < frames.length; i++) {
          var frame = frames[i];
          if (!frame || frame.contentWindow !== ev.source) continue;
          if (frame.closest && frame.closest('.hidden')) return;
          var raw = Number(data.height || 0);
          if (!raw || raw < 240) return;
          var extra = (window.innerWidth || document.documentElement.clientWidth || 0) <= 760 ? 90 : 45;
          frame.style.height = Math.min(Math.ceil(raw + extra), 50000) + 'px';
          break;
        }
      } catch (_) {}
    });
    function showAdminPanel(name){
      var isSettings = name === 'settings';
      var isEmail = name === 'email';
      var isKeepalive = name === 'keepalive';
      var isIntake = name === 'intake';
      document.getElementById('accountsCard').classList.toggle('hidden', isSettings || isEmail || isKeepalive || isIntake);
      document.getElementById('intakeCard').classList.toggle('hidden', !isIntake);
      document.getElementById('settingsCard').classList.toggle('hidden', !isSettings);
      document.getElementById('emailCard').classList.toggle('hidden', !isEmail);
      document.getElementById('keepaliveCard').classList.toggle('hidden', !isKeepalive);
      document.getElementById('tabAccounts').classList.toggle('active', !isSettings && !isEmail && !isKeepalive && !isIntake);
      document.getElementById('tabIntake').classList.toggle('active', isIntake);
      document.getElementById('tabSettings').classList.toggle('active', isSettings);
      document.getElementById('tabEmail').classList.toggle('active', isEmail);
      document.getElementById('tabKeepalive').classList.toggle('active', isKeepalive);
      var sf = document.getElementById('settingsFrame');
      var ef = document.getElementById('emailFrame');
      var kf = document.getElementById('keepaliveFrame');
      var inf = document.getElementById('intakeFrame');
      var af = document.getElementById('accountsFrame');
      if (!isSettings && !isEmail && !isKeepalive && !isIntake && !af.getAttribute('src')) af.setAttribute('src', af.dataset.src);
      if (isIntake && !inf.getAttribute('src')) inf.setAttribute('src', inf.dataset.src);
      if (isSettings && !sf.getAttribute('src')) sf.setAttribute('src', sf.dataset.src);
      if (isEmail && !ef.getAttribute('src')) ef.setAttribute('src', ef.dataset.src);
      if (isKeepalive && !kf.getAttribute('src')) kf.setAttribute('src', kf.dataset.src);
      // v86: đổi hash bằng replaceState để trình duyệt không tự cuộn theo hash.
      if (isSettings) history.replaceState(null, '', location.pathname + location.search + '#settings');
      else if (isEmail) history.replaceState(null, '', location.pathname + location.search + '#email');
      else if (isKeepalive) history.replaceState(null, '', location.pathname + location.search + '#keepalive');
      else if (isIntake) history.replaceState(null, '', location.pathname + location.search + '#intake');
      else history.replaceState(null, '', location.pathname + location.search);
      [af, inf, sf, ef, kf].forEach(function(f){
        if (f && f.closest && f.closest('.hidden')) f.style.height = '0px';
      });
      setTimeout(function(){
        resizeFrame(isKeepalive ? kf : (isEmail ? ef : (isSettings ? sf : (isIntake ? inf : af))));
      }, 250);
    }
    function showAdminMain(){
      document.getElementById('adminLoginCard').classList.add('hidden');
      document.getElementById('adminMain').classList.remove('hidden');
      var refreshBtn = document.getElementById('refreshActivePanel');
      var logoutBtn = document.getElementById('adminLogoutBtn');
      if (refreshBtn) refreshBtn.classList.remove('hidden');
      if (logoutBtn) logoutBtn.classList.remove('hidden');
      saveSharedSecret(ADMIN_LOGIN_PASSWORD);
      loadGuideSettings();
      if (location.hash === '#intake') showAdminPanel('intake');
      else if (location.hash === '#settings') showAdminPanel('settings');
      else if (location.hash === '#email') showAdminPanel('email');
      else if (location.hash === '#keepalive') showAdminPanel('keepalive');
      else showAdminPanel('accounts');

    }
    function showAdminLogin(){
      document.getElementById('adminMain').classList.add('hidden');
      document.getElementById('adminLoginCard').classList.remove('hidden');
      var refreshBtn = document.getElementById('refreshActivePanel');
      var logoutBtn = document.getElementById('adminLogoutBtn');
      if (refreshBtn) refreshBtn.classList.add('hidden');
      if (logoutBtn) logoutBtn.classList.add('hidden');
      loadRememberedAdmin();
      var e = document.getElementById('adminLoginEmail');
      var p = document.getElementById('adminLoginPassword');
      setTimeout(function(){ try { (p && !p.value ? p : e).focus(); } catch(_){} }, 60);
    }
    function doAdminLogin(){
      var email = String((document.getElementById('adminLoginEmail') || {}).value || '').trim().toLowerCase();
      var pass = String((document.getElementById('adminLoginPassword') || {}).value || '');
      var err = document.getElementById('adminLoginError');
      if (email === ADMIN_LOGIN_EMAIL && pass === ADMIN_LOGIN_PASSWORD) {
        clearAdminStoredCredentials();
        saveAdminSession();
        if (err) err.style.display = 'none';
        try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
        showAdminMain();
      } else {
        if (err) err.style.display = 'block';
      }
    }
    function doAdminLogout(){
      clearAdminStoredCredentials();
      clearAdminSession();
      ['accountsFrame','intakeFrame','settingsFrame','emailFrame','keepaliveFrame'].forEach(function(id){ var f=document.getElementById(id); if(f) f.removeAttribute('src'); });
      showAdminLogin();
    }
    window.addEventListener('load', function(){
      var input = document.getElementById('sharedAdminSecret');
      if (input) input.value = DEFAULT_ADMIN_SECRET;
      var loginBtn = document.getElementById('adminLoginBtn');
      var logoutBtn = document.getElementById('adminLogoutBtn');
      var refreshBtn = document.getElementById('refreshActivePanel');
      var guideBtn = document.getElementById('adminGuideVideoBtn');
      var saveGuideBtn = document.getElementById('saveGuideVideoBtn');
      var previewGuideBtn = document.getElementById('previewGuideVideoBtn');
      var closeGuideBtn = document.getElementById('closeGuideVideoModal');
      var guideModal = document.getElementById('guideVideoModal');
      if (loginBtn) loginBtn.addEventListener('click', doAdminLogin);
      if (logoutBtn) logoutBtn.addEventListener('click', doAdminLogout);
      if (refreshBtn) refreshBtn.addEventListener('click', refreshActivePanel);
      if (guideBtn) guideBtn.addEventListener('click', function(){ openGuideVideo(); });
      if (saveGuideBtn) saveGuideBtn.addEventListener('click', saveGuideSettings);
      if (previewGuideBtn) previewGuideBtn.addEventListener('click', function(){ var i=document.getElementById('adminGuideVideoUrl'); openGuideVideo(i && i.value); });
      if (closeGuideBtn) closeGuideBtn.addEventListener('click', closeGuideVideo);
      if (guideModal) guideModal.addEventListener('click', function(ev){ if (ev.target === guideModal) closeGuideVideo(); });
      window.addEventListener('keydown', function(ev){ if (ev.key === 'Escape') closeGuideVideo(); });
      ['adminLoginEmail','adminLoginPassword'].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') doAdminLogin(); });
      });

      var scrollTopBtn = document.getElementById('adminScrollTopBtn');
      if (scrollTopBtn) {
        scrollTopBtn.addEventListener('click', function(){
          try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (_) { window.scrollTo(0, 0); }
        });
        var updateScrollTopBtn = function(){
          scrollTopBtn.classList.toggle('show', (window.scrollY || document.documentElement.scrollTop || 0) > 360);
        };
        window.addEventListener('scroll', updateScrollTopBtn, { passive: true });
        updateScrollTopBtn();
      }
      clearAdminStoredCredentials();
      if (restoreAdminSession()) showAdminMain();
      else showAdminLogin();
    });
  </script>
</body>
</html>
