<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Admin quản lý tubekey.vn</title>
  <script>
    (function(){
      var canonicalHost = 'www.tubekey.vn';
      var localHosts = ['localhost','127.0.0.1','0.0.0.0'];
      var host = String(location.hostname || '').toLowerCase();
      if (localHosts.indexOf(host) === -1 && host !== canonicalHost) {
        location.replace('https://' + canonicalHost + '/admin.html' + location.search + location.hash);
      }
    })();
  </script>
  <style>
    :root{--bg:#07111f;--card:#0f1b2d;--card2:#0b1526;--line:#223650;--text:#ffffff;--muted:#9fb3ce;--cyan:#22d3ee;--cyan2:#67e8f9}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:radial-gradient(circle at top,#10213a,#07111f 55%);color:var(--text);min-height:100vh}
    .wrap{width:96%;max-width:1480px;margin:0 auto;padding:24px 0 38px}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
    h1{margin:0;font-size:32px;letter-spacing:-.4px}
    .sub{margin:8px 0 0;color:var(--muted);line-height:1.5;font-size:14px}
    .back{color:#22d3ee;text-decoration:none;background:#0b1526;border:1px solid var(--line);padding:10px 12px;border-radius:12px;white-space:nowrap}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
    .tab{border:1px solid var(--line);border-radius:14px;background:#172338;color:#cfe4ff;padding:13px 18px;font-size:14px;cursor:pointer}
    .tab.active{background:var(--cyan);color:#00111f}
    .note{background:#10253a;border:1px solid #1f4967;color:#b9d8ee;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.5}
    .frame-card{background:rgba(15,27,45,.96);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.24)}
    iframe{display:block;width:100%;border:0;background:transparent;min-height:1200px}
    .hidden{display:none!important}
    @media(max-width:750px){.top{flex-direction:column}.wrap{width:100%;padding:16px 8px 28px}h1{font-size:24px}.tab{flex:1;min-width:150px}.frame-card{border-radius:16px}iframe{min-height:1500px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Admin quản lý tubekey.vn</h1>
        <div class="sub">Gộp quản lý tài khoản, PRO, đơn hàng, cấu hình thanh toán SePay, SMTP và giá gói trong một link duy nhất.</div>
      </div>
      <a class="back" href="https://www.tubekey.vn/">← Về tool</a>
    </div>

    <div class="tabs">
      <button id="tabAccounts" class="tab active" type="button" onclick="showAdminPanel('accounts')">Quản lý tài khoản</button>
      <button id="tabSettings" class="tab" type="button" onclick="showAdminPanel('settings')">Thanh toán & SMTP</button>
    </div>

    <div class="note">Link quản lý chính: <span style="color:#67e8f9">https://www.tubekey.vn/admin.html</span>. Các link cũ sẽ tự chuyển về trang này.</div>

    <div id="accountsCard" class="frame-card">
      <iframe id="accountsFrame" src="/admin-account-panel.html" title="Quản lý tài khoản" onload="resizeFrame(this)"></iframe>
    </div>
    <div id="settingsCard" class="frame-card hidden">
      <iframe id="settingsFrame" data-src="/admin-settings-panel.html" title="Thanh toán và SMTP" onload="resizeFrame(this)"></iframe>
    </div>
  </div>

  <script>
    function resizeFrame(frame){
      try {
        var doc = frame.contentDocument || frame.contentWindow.document;
        var h = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight, 900);
        frame.style.height = (h + 40) + 'px';
      } catch (_) {}
    }
    function showAdminPanel(name){
      var isSettings = name === 'settings';
      document.getElementById('accountsCard').classList.toggle('hidden', isSettings);
      document.getElementById('settingsCard').classList.toggle('hidden', !isSettings);
      document.getElementById('tabAccounts').classList.toggle('active', !isSettings);
      document.getElementById('tabSettings').classList.toggle('active', isSettings);
      var sf = document.getElementById('settingsFrame');
      if (isSettings && !sf.getAttribute('src')) sf.setAttribute('src', sf.dataset.src);
      if (isSettings) location.hash = 'settings'; else history.replaceState(null, '', location.pathname + location.search);
      setTimeout(function(){
        resizeFrame(isSettings ? sf : document.getElementById('accountsFrame'));
      }, 600);
    }
    window.addEventListener('load', function(){
      if (location.hash === '#settings') showAdminPanel('settings');
      setInterval(function(){
        var active = document.getElementById('settingsCard').classList.contains('hidden') ? document.getElementById('accountsFrame') : document.getElementById('settingsFrame');
        resizeFrame(active);
      }, 1200);
    });
  </script>
</body>
</html>
