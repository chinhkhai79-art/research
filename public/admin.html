<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Admin quản lý tubekey.vn</title>
  <script>
    (function(){
      var canonicalHost = 'www.tubekey.vn';
      var localHosts = ['localhost','127.0.0.1','0.0.0.0'];
      var host = String(location.hostname || '').toLowerCase();
      if (localHosts.indexOf(host) === -1 && host !== canonicalHost) {
        location.replace('https://' + canonicalHost + '/admin.html' + location.search + location.hash);
      }
    })();
  </script>
  <style>
    :root{--bg:#f4f8fd;--card:#ffffff;--card2:#eef5fc;--line:#d8e3ef;--text:#0f172a;--muted:#64748b;--cyan:#22d3ee;--cyan2:#0ea5e9}
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,"Helvetica Neue",sans-serif;background:linear-gradient(180deg,#f6f9fe 0%,#eef4fb 100%);color:var(--text);min-height:100vh;overflow-x:hidden}
    .wrap{width:96%;max-width:1480px;margin:0 auto;padding:24px 0 38px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px}
    h1{margin:0;font-size:32px;letter-spacing:-.4px;font-weight:400}
    .sub{margin:8px 0 0;color:var(--muted);line-height:1.5;font-size:14px;font-weight:400}
    .back{color:#2563eb;text-decoration:none;background:#eff6ff;border:1px solid #bfdbfe;padding:10px 12px;border-radius:12px;white-space:nowrap;font-weight:400}
    .tabs{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0;align-items:center}
    .tab{border:1px solid var(--line);border-radius:14px;background:#ffffff;color:#334155;padding:13px 18px;font-size:14px;cursor:pointer;white-space:nowrap;font-weight:400}
    .tab.active{background:var(--cyan);color:#00111f;border-color:#67e8f9}
    .note{background:#eff8ff;border:1px solid #bfdbfe;color:#245078;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:13px;line-height:1.5}
    .frame-card{background:#ffffff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 18px 48px rgba(15,23,42,.08)}
    iframe{display:block;width:100%;border:0;background:transparent;min-height:0;height:auto}
    .shared-secret{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 38px rgba(15,23,42,.07);padding:16px;margin:12px 0 16px}
    .shared-grid{display:grid;grid-template-columns:minmax(280px,1fr) auto auto;gap:12px;align-items:end}
    .shared-field label{display:block;color:var(--muted);font-size:13px;margin-bottom:7px;font-weight:400}
    .secret-wrap{display:flex}.secret-wrap input{width:100%;border:1px solid #cbd5e1;border-radius:12px 0 0 12px;background:#fff;padding:12px 14px;font-size:15px;outline:none}.eye{width:48px;border:1px solid #cbd5e1;border-left:0;border-radius:0 12px 12px 0;background:#fff;cursor:pointer}.admin-btn{border:0;border-radius:12px;padding:12px 18px;font-size:14px;cursor:pointer;white-space:nowrap;background:#22d3ee;color:#00111f}.admin-btn.gray{background:#f1f5f9;color:#334155;border:1px solid #cbd5e1}.shared-note{margin-top:10px;color:var(--muted);font-size:13px}
    @media(max-width:750px){.shared-grid{grid-template-columns:1fr}.admin-btn{width:100%}}
    .hidden{display:none!important}
    .login-card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 48px rgba(15,23,42,.08);padding:22px;margin:18px 0;max-width:720px}
    .login-card h2{margin:0 0 8px;color:#0f3b66;font-weight:500;font-size:26px}
    .login-card p{margin:0 0 16px;color:#000;font-size:14px;line-height:1.5}
    .login-grid{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end}
    .login-field label{display:block;color:#000;font-size:13px;margin-bottom:7px}
    .login-field input{width:100%;border:1px solid #cbd5e1;border-radius:12px;background:#fff;padding:13px 14px;font-size:15px;outline:none;color:#000}
    .login-error{margin-top:12px;color:#dc2626;font-size:14px;display:none}
    .admin-session .shared-grid{grid-template-columns:minmax(280px,1fr) auto auto}
    .session-title{font-size:15px;color:#000}.session-title b{color:#0f3b66;font-weight:500}
    .logout-btn{background:#fee2e2!important;color:#991b1b!important;border:1px solid #fecaca!important}
    @media(max-width:850px){.login-grid{grid-template-columns:1fr}.login-card{max-width:none}.admin-session .shared-grid{grid-template-columns:1fr}}
    @media(max-width:750px){.top{flex-direction:column}.wrap{width:100%;padding:16px 8px 28px}h1{font-size:24px}.tab{flex:1;min-width:150px}.frame-card{border-radius:16px}iframe{min-height:0}}
    /* v30: chữ trong admin dùng đen 100% để dễ đọc */
    body,.sub,.shared-field label,.shared-note,.tab,.back,.admin-btn.gray,input{color:#000 !important}
    h1{color:#000 !important}
    .tab.active,.admin-btn{color:#000 !important}

    /* v31: tiêu đề dùng màu riêng để dễ phân biệt, nội dung vẫn đen */
    h1,.title h1{color:#0f3b66 !important}
    .tab.active{box-shadow:0 8px 22px rgba(34,211,238,.22)}

  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Admin quản lý tubekey.vn</h1>
        
      </div>
      <a class="back" href="https://www.tubekey.vn/">← Về tool</a>
    </div>

    <div id="adminLoginCard" class="login-card">
      <h2>Đăng nhập quản trị</h2>
      <p>Chỉ tài khoản quản trị đúng mới mở được trang quản lý.</p>
      <div class="login-grid">
        <div class="login-field">
          <label>Email quản trị</label>
          <input id="adminLoginEmail" type="email" autocomplete="username" placeholder="vantheweb@gmail.com" />
        </div>
        <div class="login-field">
          <label>Mật khẩu</label>
          <input id="adminLoginPassword" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu quản trị" />
        </div>
        <button id="adminLoginBtn" class="admin-btn" type="button">Đăng nhập</button>
      </div>
      <div id="adminLoginError" class="login-error">Sai tài khoản hoặc mật khẩu quản trị.</div>
    </div>

    <div id="adminMain" class="hidden">
      <div class="shared-secret admin-session">
        <input id="sharedAdminSecret" type="hidden" value="ThanhCong2027###" />
        <div class="shared-grid">
          <div class="session-title">Đã đăng nhập quản trị: <b id="adminEmailLabel">vantheweb@gmail.com</b></div>
          <button id="refreshActivePanel" class="admin-btn gray" type="button">Làm mới trang hiện tại</button>
          <button id="adminLogoutBtn" class="admin-btn gray logout-btn" type="button">Đăng xuất</button>
        </div>
        <div id="sharedSecretNote" class="shared-note">Mật khẩu quản trị đã được đồng bộ cho các trang quản lý.</div>
      </div>

      <div class="tabs">
      <button id="tabAccounts" class="tab active" type="button" onclick="showAdminPanel('accounts')">Quản lý tài khoản</button>
      <button id="tabSettings" class="tab" type="button" onclick="showAdminPanel('settings')">Thanh toán & SMTP</button>
      <button id="tabEmail" class="tab" type="button" onclick="showAdminPanel('email')">Mẫu email</button>
    </div>

    <div id="accountsCard" class="frame-card">
      <iframe id="accountsFrame" data-src="/admin-account-panel.html" title="Quản lý tài khoản" onload="handleFrameLoad(this, 'accounts')"></iframe>
    </div>
    <div id="settingsCard" class="frame-card hidden">
      <iframe id="settingsFrame" data-src="/admin-settings-panel.html" title="Thanh toán và SMTP" onload="handleFrameLoad(this, 'settings')"></iframe>
    </div>
    <div id="emailCard" class="frame-card hidden">
      <iframe id="emailFrame" data-src="/admin-email-panel.html" title="Mẫu email" onload="handleFrameLoad(this, 'email')"></iframe>
    </div>
    </div>
  </div>

  <script>
    try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (_) {}
    var DEFAULT_ADMIN_SECRET = 'ThanhCong2027###';
    var ADMIN_LOGIN_EMAIL = 'vantheweb@gmail.com';
    var ADMIN_LOGIN_PASSWORD = 'ThanhCong2027###';
    function getSharedSecret(){
      return String(localStorage.getItem('ADMIN_SHARED_SECRET') || localStorage.getItem('ADMIN_SECRET_RESEARCH') || localStorage.getItem('ADMIN_SECRET') || localStorage.getItem('admin_settings_password') || DEFAULT_ADMIN_SECRET).trim();
    }
    function saveSharedSecret(value){
      var input = document.getElementById('sharedAdminSecret');
      var v = String(value || (input && input.value) || DEFAULT_ADMIN_SECRET).trim() || DEFAULT_ADMIN_SECRET;
      if (input) input.value = v;
      localStorage.setItem('ADMIN_SHARED_SECRET', v);
      localStorage.setItem('ADMIN_SECRET_RESEARCH', v);
      localStorage.setItem('ADMIN_SECRET', v);
      localStorage.setItem('admin_settings_password', v);
      localStorage.setItem('admin_settings_login_at', Date.now().toString());
      var note = document.getElementById('sharedSecretNote');
      if (note) note.textContent = 'Mật khẩu quản trị đã được đồng bộ cho các trang quản lý.';
      syncSharedSecretToFrames();
    }
    function syncSharedSecretToFrame(frame){
      try {
        var win = frame.contentWindow;
        if (!win) return;
        var value = getSharedSecret();
        if (typeof win.syncSharedAdminSecret === 'function') win.syncSharedAdminSecret(value);
        else win.postMessage({ type: 'ADMIN_SHARED_SECRET', value: value }, location.origin);
      } catch (_) {}
    }
    function syncSharedSecretToFrames(){
      syncSharedSecretToFrame(document.getElementById('accountsFrame'));
      syncSharedSecretToFrame(document.getElementById('settingsFrame'));
      syncSharedSecretToFrame(document.getElementById('emailFrame'));
    }
    function refreshActivePanel(){
      saveSharedSecret();
      var isSettings = !document.getElementById('settingsCard').classList.contains('hidden');
      var isEmail = !document.getElementById('emailCard').classList.contains('hidden');
      var frame = isEmail ? document.getElementById('emailFrame') : (isSettings ? document.getElementById('settingsFrame') : document.getElementById('accountsFrame'));
      try {
        var win = frame.contentWindow;
        if (isEmail && typeof win.load === 'function') win.load();
        else if (isSettings && typeof win.loadConfig === 'function') win.loadConfig();
        else if (!isSettings && !isEmail && typeof win.loadUsers === 'function') win.loadUsers(win.currentUsersPage || 1, true);
      } catch (_) {}
      setTimeout(function(){ resizeFrame(frame); }, 600);
    }
    function resizeFrame(frame){
      try {
        if (!frame || !frame.contentWindow) return;
        if (frame.closest && frame.closest('.hidden')) return;
        var doc = frame.contentDocument || frame.contentWindow.document;
        if (!doc) return;
        var main = doc.querySelector('.wrap') || doc.querySelector('.page') || doc.body;
        if (!main) return;
        try {
          doc.documentElement.style.minHeight = '0';
          doc.body.style.minHeight = '0';
          doc.documentElement.style.overflow = 'visible';
          doc.body.style.overflow = 'visible';
        } catch (_) {}
        var top = main.getBoundingClientRect ? main.getBoundingClientRect().top : 0;
        var maxBottom = 0;
        var nodes = main.querySelectorAll ? main.querySelectorAll('.card:not(.hidden), .tabs, .status:not(.hidden), .grid:not(.hidden), .top:not(.hidden)') : [];
        for (var i = 0; i < nodes.length; i++) {
          var el = nodes[i];
          if (!el || el.offsetParent === null) continue;
          var r = el.getBoundingClientRect();
          if (r && r.bottom) maxBottom = Math.max(maxBottom, r.bottom - top);
        }
        var fallback = main.offsetHeight || 0;
        var h = Math.max(maxBottom || fallback || 0, 420);
        h = Math.ceil(h + 28);
        if (Math.abs((parseInt(frame.style.height, 10) || 0) - h) > 6) frame.style.height = h + 'px';
      } catch (_) {}
    }
    function handleFrameLoad(frame, name){
      saveSharedSecret();
      syncSharedSecretToFrame(frame);
      setTimeout(function(){ resizeFrame(frame); }, name === 'settings' ? 900 : 450);
    }
    function showAdminPanel(name){
      var isSettings = name === 'settings';
      var isEmail = name === 'email';
      document.getElementById('accountsCard').classList.toggle('hidden', isSettings || isEmail);
      document.getElementById('settingsCard').classList.toggle('hidden', !isSettings);
      document.getElementById('emailCard').classList.toggle('hidden', !isEmail);
      document.getElementById('tabAccounts').classList.toggle('active', !isSettings && !isEmail);
      document.getElementById('tabSettings').classList.toggle('active', isSettings);
      document.getElementById('tabEmail').classList.toggle('active', isEmail);
      var sf = document.getElementById('settingsFrame');
      var ef = document.getElementById('emailFrame');
      var af = document.getElementById('accountsFrame');
      if (!isSettings && !isEmail && !af.getAttribute('src')) af.setAttribute('src', af.dataset.src);
      if (isSettings && !sf.getAttribute('src')) sf.setAttribute('src', sf.dataset.src);
      if (isEmail && !ef.getAttribute('src')) ef.setAttribute('src', ef.dataset.src);
      if (isSettings) location.hash = 'settings';
      else if (isEmail) location.hash = 'email';
      else history.replaceState(null, '', location.pathname + location.search);
      setTimeout(function(){
        resizeFrame(isEmail ? ef : (isSettings ? sf : document.getElementById('accountsFrame')));
        try { window.scrollTo({ top: 0, behavior: 'auto' }); } catch (_) { window.scrollTo(0,0); }
      }, 600);
    }
    function showAdminMain(){
      document.getElementById('adminLoginCard').classList.add('hidden');
      document.getElementById('adminMain').classList.remove('hidden');
      var lbl = document.getElementById('adminEmailLabel');
      if (lbl) lbl.textContent = ADMIN_LOGIN_EMAIL;
      saveSharedSecret(ADMIN_LOGIN_PASSWORD);
      if (location.hash === '#settings') showAdminPanel('settings');
      else if (location.hash === '#email') showAdminPanel('email');
      else showAdminPanel('accounts');
      setTimeout(function(){ try { window.scrollTo(0,0); } catch(_){} }, 80);
    }
    function showAdminLogin(){
      document.getElementById('adminMain').classList.add('hidden');
      document.getElementById('adminLoginCard').classList.remove('hidden');
      var e = document.getElementById('adminLoginEmail');
      var p = document.getElementById('adminLoginPassword');
      if (e && !e.value) e.value = ADMIN_LOGIN_EMAIL;
      if (p) p.value = '';
      setTimeout(function(){ try { (p || e).focus(); } catch(_){} }, 60);
      try { window.scrollTo(0,0); } catch(_){}
    }
    function doAdminLogin(){
      var email = String((document.getElementById('adminLoginEmail') || {}).value || '').trim().toLowerCase();
      var pass = String((document.getElementById('adminLoginPassword') || {}).value || '');
      var err = document.getElementById('adminLoginError');
      if (email === ADMIN_LOGIN_EMAIL && pass === ADMIN_LOGIN_PASSWORD) {
        sessionStorage.setItem('TUBEKEY_ADMIN_AUTH_OK', '1');
        localStorage.setItem('TUBEKEY_ADMIN_EMAIL', ADMIN_LOGIN_EMAIL);
        if (err) err.style.display = 'none';
        showAdminMain();
      } else {
        if (err) err.style.display = 'block';
      }
    }
    function doAdminLogout(){
      sessionStorage.removeItem('TUBEKEY_ADMIN_AUTH_OK');
      ['ADMIN_SHARED_SECRET','ADMIN_SECRET_RESEARCH','ADMIN_SECRET','admin_settings_password','admin_settings_login_at'].forEach(function(k){ try{ localStorage.removeItem(k); }catch(_){} });
      ['accountsFrame','settingsFrame','emailFrame'].forEach(function(id){ var f=document.getElementById(id); if(f) f.removeAttribute('src'); });
      showAdminLogin();
    }
    window.addEventListener('load', function(){
      var input = document.getElementById('sharedAdminSecret');
      if (input) input.value = DEFAULT_ADMIN_SECRET;
      var loginBtn = document.getElementById('adminLoginBtn');
      var logoutBtn = document.getElementById('adminLogoutBtn');
      var refreshBtn = document.getElementById('refreshActivePanel');
      if (loginBtn) loginBtn.addEventListener('click', doAdminLogin);
      if (logoutBtn) logoutBtn.addEventListener('click', doAdminLogout);
      if (refreshBtn) refreshBtn.addEventListener('click', refreshActivePanel);
      ['adminLoginEmail','adminLoginPassword'].forEach(function(id){
        var el = document.getElementById(id);
        if (el) el.addEventListener('keydown', function(ev){ if(ev.key === 'Enter') doAdminLogin(); });
      });
      if (sessionStorage.getItem('TUBEKEY_ADMIN_AUTH_OK') === '1') showAdminMain();
      else showAdminLogin();
      setInterval(function(){
        if (document.getElementById('adminMain').classList.contains('hidden')) return;
        var active = !document.getElementById('emailCard').classList.contains('hidden') ? document.getElementById('emailFrame') : (document.getElementById('settingsCard').classList.contains('hidden') ? document.getElementById('accountsFrame') : document.getElementById('settingsFrame'));
        resizeFrame(active);
      }, 1200);
    });
  </script>
</body>
</html>
