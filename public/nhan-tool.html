<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Đăng ký nâng cấp PRO - TubeKey</title>
  <style>
    :root{--navy:#123b61;--blue:#168ed1;--orange:#f37a1f;--ink:#163047;--muted:#63778b;--line:#dbe6ef;--bg:#edf4f9;--ok:#14875b;--err:#c83e4d}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;color:var(--ink);background:var(--bg)}
    body{background:radial-gradient(circle at 14% 4%,rgba(36,164,222,.18),transparent 30%),radial-gradient(circle at 90% 94%,rgba(243,122,31,.13),transparent 34%),var(--bg)}
    .page{width:min(760px,calc(100% - 28px));margin:0 auto;padding:34px 0 50px}.brand{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--navy);font-size:20px;font-weight:900;margin-bottom:22px}.brand-mark{display:grid;place-items:center;width:42px;height:42px;overflow:hidden}.brand-mark img{display:block;width:100%;height:100%;object-fit:contain}
    .shell{display:block;background:#fff;border:1px solid rgba(190,210,226,.85);border-radius:28px;overflow:hidden;box-shadow:0 24px 65px rgba(25,55,82,.13)}
    .form-wrap{padding:38px}.form-head{text-align:center;margin:0 0 28px}.form-title{font-size:30px;line-height:1.25;margin:0 0 9px;color:var(--navy)}.form-sub{color:var(--muted);font-size:15px;margin:0;line-height:1.55;white-space:pre-line}.field{margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}.required{color:var(--orange)}input{width:100%;border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:#fbfdff;color:var(--ink);font:inherit;outline:none;transition:.2s}input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(22,142,209,.11);background:#fff}.hp{position:absolute!important;left:-9999px!important;opacity:0!important;pointer-events:none!important}
    .submit{width:100%;border:0;border-radius:14px;padding:14px 18px;background:linear-gradient(135deg,var(--orange),#ff9a32);color:#fff;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 12px 25px rgba(243,122,31,.25);transition:.2s}.submit:hover{transform:translateY(-1px)}.submit:disabled{opacity:.65;cursor:wait;transform:none}
    .notice{display:none;margin-bottom:18px;padding:13px 15px;border-radius:13px;font-size:14px;line-height:1.5}.notice.show{display:block}.notice.error{background:#fff0f1;border:1px solid #f4c6cb;color:var(--err)}.notice.ok{background:#ecfbf4;border:1px solid #bdebd4;color:var(--ok)}
    .loading,.unavailable{padding:70px 28px;text-align:center}.spinner{width:34px;height:34px;margin:0 auto 15px;border:4px solid #dbe9f2;border-top-color:var(--blue);border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.hidden{display:none!important}
    .success{padding:48px 38px;text-align:center}.success-icon{display:grid;place-items:center;width:74px;height:74px;margin:0 auto 19px;border-radius:50%;background:#e5f8ef;color:var(--ok);font-size:36px}.success h2{font-size:27px;color:var(--navy);margin:0 0 10px}.success p{color:var(--muted);line-height:1.65;margin:0 auto 22px;max-width:520px}.tool-button{display:inline-flex;align-items:center;justify-content:center;padding:14px 24px;border-radius:14px;background:var(--orange);color:#fff;text-decoration:none;font-weight:900;box-shadow:0 12px 25px rgba(243,122,31,.23)}
    @media(max-width:760px){.page{width:min(100% - 18px,620px);padding:16px 0 30px}.brand{margin-bottom:14px}.shell{border-radius:21px}.form-wrap{padding:27px 20px 24px}.form-head{margin-bottom:23px}.form-title{font-size:26px}.grid{grid-template-columns:1fr;gap:0}.success{padding:38px 22px}}
  </style>
</head>
<body>
  <main class="page">
    <div class="brand"><span class="brand-mark"><img src="/icon-192x192.png" alt="" aria-hidden="true" /></span><span>TubeKey.vn</span></div>
    <section id="loading" class="shell loading"><div><div class="spinner"></div><b>Đang tải biểu mẫu đăng ký PRO...</b></div></section>
    <section id="unavailable" class="shell unavailable hidden"><div><h2>Link chưa sẵn sàng</h2><p id="unavailableText">Không tải được biểu mẫu này.</p></div></section>
    <section id="content" class="shell hidden">
      <div class="form-wrap">
        <div id="formArea">
          <header class="form-head">
            <h1 id="campaignTitle" class="form-title">Đăng ký nâng cấp PRO</h1>
            <p id="campaignDescription" class="form-sub">Điền đúng thông tin tài khoản để admin kiểm tra.</p>
          </header>
          <div id="notice" class="notice" role="alert" aria-live="polite"></div>
          <form id="intakeForm" novalidate>
            <input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" />
            <div class="field"><label for="fullName">Họ và tên <span class="required">*</span></label><input id="fullName" name="fullName" autocomplete="name" maxlength="150" required placeholder="Ví dụ: Nguyễn Văn A" /></div>
            <div class="grid">
              <div class="field" id="phoneField"><label for="phone">Số điện thoại <span id="phoneRequired" class="required">*</span></label><input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" maxlength="24" required placeholder="Ví dụ: 0349996320 hoặc +1 202 555 0123" /></div>
              <div class="field"><label for="email">Email <span class="required">*</span></label><input id="email" name="email" type="email" autocomplete="email" maxlength="190" required placeholder="ban@gmail.com" /></div>
            </div>
            <div class="field"><label for="zalo">Link nhóm Zalo <span id="zaloRequired" class="required">*</span></label><input id="zalo" name="zalo" type="url" inputmode="url" autocomplete="url" maxlength="200" required placeholder="https://zalo.me/g/stmbujxgboawdcem8wjk" /></div>
            <button id="submitBtn" class="submit" type="submit">Đăng ký nâng cấp PRO</button>
          </form>
        </div>
        <div id="successArea" class="success hidden">
          <div class="success-icon">✓</div><h2>Đăng ký thành công!</h2><p id="successMessage"></p>
        </div>
      </div>
    </section>
  </main>
  <script>
    (function(){
      'use strict';
      var state={slug:'',campaign:null};
      function $(id){return document.getElementById(id)}
      function setHidden(id,hidden){$(id).classList.toggle('hidden',!!hidden)}
      function showNotice(message,type){var el=$('notice');el.textContent=message||'';el.className='notice show '+(type||'error')}
      function slugFromLocation(){var q=new URLSearchParams(location.search).get('slug');if(q)return q;var parts=location.pathname.split('/').filter(Boolean);if(parts[0]==='nhan-tool'&&parts[1])return decodeURIComponent(parts[1]);return parts.length===1?decodeURIComponent(parts[0]):''}
      async function jsonFetch(url,options){var res=await fetch(url,options||{});var data=await res.json().catch(function(){return{}});if(!res.ok||data.success===false)throw new Error(data.error||'Không xử lý được yêu cầu.');return data}
      function normalizePhone(value){var raw=String(value||'').trim();var digits=raw.replace(/\D/g,'');if(!digits)return'';if((raw.indexOf('+84')===0||raw.indexOf('0084')===0)&&digits.length===11&&digits.indexOf('84')===0)return'0'+digits.slice(2);if(raw.indexOf('+')===0)return'+'+digits;if(raw.indexOf('00')===0&&digits.length>2)return'+'+digits.slice(2);return digits}
      function validPhone(value){var digits=String(value||'').replace(/\D/g,'');return digits.length>=7&&digits.length<=15&&!/^(\d)\1+$/.test(digits)}
      function validZaloGroup(value){return /^https:\/\/zalo\.me\/g\/[A-Za-z0-9_-]{8,80}\/?$/.test(String(value||'').trim())}
      function validateEmailAddress(value){var clean=String(value||'').trim().toLowerCase();var invalid='Email không hợp lệ. Hãy nhập đầy đủ, ví dụ: tenban@gmail.com.';var parts=clean.split('@');if(parts.length!==2)return{value:'',error:invalid};var local=parts[0],domain=parts[1];if(!local||local.length>64||local.charAt(0)==='.'||local.charAt(local.length-1)==='.'||local.indexOf('..')!==-1)return{value:'',error:invalid};if(!/^[a-z0-9!#$%&'*+/=?^_`{|}~.-]+$/i.test(local)||!domain||domain.length>253||domain.indexOf('.')===-1)return{value:'',error:invalid};var labels=domain.split('.');if(labels.some(function(label){return !/^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$/i.test(label)}))return{value:'',error:invalid};var tld=labels[labels.length-1];if(!/^(?:[a-z]{2,63}|xn--[a-z0-9-]{2,59})$/i.test(tld))return{value:'',error:invalid};var corrections={'gmai.com':'gmail.com','gmial.com':'gmail.com','gmail.co':'gmail.com','gmail.con':'gmail.com','gmail.cm':'gmail.com','gmail.om':'gmail.com','googlemai.com':'googlemail.com','googlemail.co':'googlemail.com','outlok.com':'outlook.com','outlook.co':'outlook.com','outlook.con':'outlook.com','hotmai.com':'hotmail.com','hotmal.com':'hotmail.com','hotmail.co':'hotmail.com','hotmail.con':'hotmail.com','yaho.com':'yahoo.com','yhoo.com':'yahoo.com','yahoo.co':'yahoo.com','yahoo.con':'yahoo.com','icloud.co':'icloud.com','icloud.con':'icloud.com','iclod.com':'icloud.com'};if(corrections[domain])return{value:'',error:'Bạn có nhập nhầm đuôi email “@'+domain+'”? Vui lòng dùng “@'+corrections[domain]+'”.'};return{value:clean,error:''}}
      function validateForm(){var name=$('fullName').value.trim();var cleanPhone=normalizePhone($('phone').value);var checkedEmail=validateEmailAddress($('email').value);var zalo=$('zalo').value.trim();if(name.length<2){showNotice('Vui lòng nhập đầy đủ họ và tên.','error');$('fullName').focus();return false}$('phone').value=cleanPhone;if(!validPhone(cleanPhone)){showNotice('Số điện thoại không hợp lệ. Có thể nhập số Việt Nam hoặc số quốc tế 7–15 chữ số, ví dụ +1 202 555 0123.','error');$('phone').focus();return false}if(!checkedEmail.value){showNotice(checkedEmail.error,'error');$('email').focus();return false}$('email').value=checkedEmail.value;if(!validZaloGroup(zalo)){showNotice('Link nhóm Zalo không hợp lệ. Link phải có dạng https://zalo.me/g/xxxxxxxx','error');$('zalo').focus();return false}return true}
      function renderCampaign(campaign){state.campaign=campaign;$('campaignTitle').textContent=campaign.title||'Đăng ký nâng cấp PRO';$('campaignDescription').textContent=campaign.description||'Điền đúng thông tin tài khoản để admin kiểm tra.';var label=campaign.buttonLabel||'';$('submitBtn').textContent=!label||label==='Đăng ký nhận tool'?'Đăng ký nâng cấp PRO':label;$('phone').required=true;setHidden('phoneRequired',false);$('zalo').required=true;setHidden('zaloRequired',false);document.title=(campaign.title||'Đăng ký nâng cấp PRO')+' - TubeKey';setHidden('loading',true);setHidden('content',false)}
      async function load(){
        state.slug=slugFromLocation();
        if(!state.slug){$('unavailableText').textContent='Đường dẫn nhận tool không hợp lệ.';setHidden('loading',true);setHidden('unavailable',false);return}
        try{
          var data=await jsonFetch('/api/tool-intake?action=public-campaign&slug='+encodeURIComponent(state.slug),{cache:'no-store'});
          renderCampaign(data.campaign);
        }catch(error){
          var localPreview=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&new URLSearchParams(location.search).get('preview')==='1';
          if(localPreview)return renderCampaign({title:'Đăng ký nâng cấp TubeKey PRO',description:'Điền đúng số điện thoại, email và link nhóm Zalo để admin kiểm tra.',buttonLabel:'Đăng ký nâng cấp PRO',requirePhone:true,requireZalo:true});
          $('unavailableText').textContent=error.message||'Không tải được biểu mẫu này.';setHidden('loading',true);setHidden('unavailable',false)
        }
      }
      $('intakeForm').addEventListener('submit',async function(event){
        event.preventDefault();if(!validateForm())return;var button=$('submitBtn');button.disabled=true;var old=button.textContent;button.textContent='Đang gửi thông tin...';$('notice').className='notice';
        try{
          var payload={slug:state.slug,fullName:$('fullName').value.trim(),email:$('email').value.trim(),phone:$('phone').value.trim(),zalo:$('zalo').value.trim(),useCase:'',website:$('website').value};
          var data=await jsonFetch('/api/tool-intake?action=register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
          $('successMessage').textContent=[data.message,data.emailWarning].filter(Boolean).join(' ');setHidden('formArea',true);setHidden('successArea',false);
          window.scrollTo({top:0,behavior:'smooth'});
        }catch(error){showNotice(error.message||'Không gửi được thông tin.','error');button.disabled=false;button.textContent=old}
      });
      load();
    })();
  </script>
</body>
</html>
